name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  wrapper-validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

  build-test:
    name: Build And Test
    runs-on: ubuntu-latest
    needs:
      - wrapper-validation

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6.2.0

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Show toolchain versions
        run: |
          java -version
          ./gradlew --version

      - name: Run tests
        run: ./gradlew --no-daemon test

      - name: Build application package
        run: ./gradlew --no-daemon quarkusBuild

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: |
            build/reports/tests
            build/test-results
          if-no-files-found: ignore

      - name: Upload Quarkus build artifacts
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: quarkus-app
          path: |
            build/quarkus-app
            build/libs
          if-no-files-found: ignore
