quarkus.http.port=8080
quarkus.banner.enabled=false
quarkus.datasource.devservices.enabled=false
quarkus.http.access-log.enabled=true
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.binder.jvm=true
quarkus.micrometer.binder.http-server.enabled=true
quarkus.flyway.migrate-at-start=${AEC_DB_MIGRATE:false}
quarkus.flyway.locations=db/migration
quarkus.datasource.jdbc.url=${AEC_DB_URL:}
quarkus.datasource.username=${AEC_DB_USER:}
quarkus.datasource.password=${AEC_DB_PASSWORD:}

aec.ai.provider=${AEC_AI_PROVIDER:mock}
aec.embedding.provider=${AEC_EMBEDDING_PROVIDER:mock}
aec.knowledge.repository=${AEC_KNOWLEDGE_REPOSITORY:memory}

aec.github.api-base=${AEC_GITHUB_API_BASE:https://api.github.com}
aec.github.token=${GITHUB_TOKEN:}

aec.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com}
aec.openai.api-key=${OPENAI_API_KEY:}
aec.openai.chat-model=${OPENAI_CHAT_MODEL:gpt-4.1-mini}
aec.openai.embedding-model=${OPENAI_EMBEDDING_MODEL:text-embedding-3-small}
